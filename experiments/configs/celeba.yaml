trials: 1
results_dir: results/celeba_CEM/

shared_params:
  dataset_config:
    dataset: celeba
    batch_size: 512
    num_workers: 8
    root_dir: data/  # torchvision expects parent of celeba/ folder
    sampling_percent: 1
    test_subsampling: 1
    num_classes: 100
    use_binary_vector_class: false
    use_imbalance: true
    num_concepts: 40
    selected_concepts: false
    image_size: 64

  intervention_config:
    competence_levels: [1]
    intervention_freq: 1
    intervention_batch_size: 256
    intervention_policies:
      - policy: "random"
        group_level: True
        use_prior: False

  skip_repr_evaluation: true
  max_epochs: 150
  top_k_accuracy: null
  save_model: true
  patience: 100
  emb_size: 16
  extra_dims: 0
  learning_rate: 0.01
  weight_decay: 4.0e-06
  weight_loss: false
  use_task_class_weights: false
  c_extractor_arch: "resnet34"
  optimizer: sgd
  bool: false
  momentum: 0.9
  sigmoidal_prob: false
  training_intervention_prob: 0
  cbm_optimizer: sgd
  n_hidden: 512
  adv_optimizer: adam
  project_name: "celeba CEM"
  check_val_every_n_epoch: 5
  compute_mi_on_gpu: False
  compute_mi_mode: 'cpu'
  accumulate_grad_batches: 1
  c2y_max_epochs: 150

runs:

  - architecture: "ConceptEmbeddingModel"
    run_name: "auto"
    sigmoidal_prob: True
    training_intervention_prob: 0
    embedding_activation: "leakyrelu"
    concept_loss_weight: 0.1
    cbm_optimizer: sgd
    patience: 400
    cbm_learning_rate: 0.01
    max_epochs: 300
    early_stopping_monitor: 'val_y_accuracy'
    early_stopping_mode: max
    early_stopping_delta: 0.0
