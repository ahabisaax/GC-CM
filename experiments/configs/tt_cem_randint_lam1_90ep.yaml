# TabularToy, 90 epochs, 5 folds, eval on the final epoch.
# Replaces the earlier TT runs (CEM 240 ep, GC-CEM 400 ep): unequal and
# needlessly long budgets. All four setups now share one protocol and differ
# only in architecture and training_intervention_prob.
# Everything else is carried over verbatim from tabulartoy.yaml: batch 64,
# emb 16, CEM lr 0.05 / GC-CEM lr 1e-3, shared_critic, and the random
# group-level intervention config at freq 1.
# NOTE the previous TT CEM baselines had training_intervention_prob 0.25,
# i.e. they were already RandInt runs. Baselines here are 0.
results_dir: results/tabulartoy_90ep/
trials: 5
shared_params:
  dataset_config:
    dataset: tabulartoy
    batch_size: 64
    num_workers: 8
    root_dir: data/TabularToy/tabulartoy_25_10k/
    considered_concepts:
    - '0'
    - '1'
    - '2'
    sampling_percent: 1
    test_subsampling: 1
  intervention_config:
    competence_levels:
    - 1
    intervention_freq: 1
    intervention_batch_size: 1024
    intervention_policies:
    - policy: random
      group_level: true
      use_prior: false
  skip_repr_evaluation: true
  learning_rate: 0.05
  bool: false
  sigmoidal_prob: false
  hidden_size: 64
  dropout_prob: 0.2
  all_dropout: false
  learning_rate_c2y: 0.05
  optimizer_c2y: adam
  c2y_max_epochs: 100
  linear_c2y: true
  compute_mi_on_gpu: false
  compute_mi_mode: cpu
  n_hidden: 64
  emb_size: 16
  weight_loss: true
  top_k_accuracy: null
  save_model: true
  extra_dims: 0
  scheduler_step: 20
  weight_decay: 0
  c_extractor_arch: tabulartoy_extractor
  cbm_learning_rate: 0.05
  early_stopping_monitor: val_y_accuracy
  early_stopping_mode: max
  early_stopping_delta: 0.0
  momentum: 0.9
  project_name: TabularToy_90ep
  max_epochs: 90
  check_val_every_n_epoch: 1
  eval_from_last: true
runs:
- architecture: ConceptEmbeddingModel
  sigmoidal_prob: true
  training_intervention_prob: 0.25
  embedding_activation: leakyrelu
  shared_prob_gen: false
  concept_loss_weight: 1
  cbm_optimizer: adam
  accumulate_grad_batches: 1
  max_epochs: 90
  patience: 400
  gradient_clip_val: 1.0
  run_name: CEM_randint0.25_adam_lr0.05_bs64_lam_c1_90ep
