# Smoke-test config: GC-CEM on TabularToy, a handful of epochs.
#
# Purpose is to exercise the FULL pipeline end to end quickly —
#   train (adversarial, two optimizers) -> eval -> CTL/ICL -> RTL/RCL
#   -> intervention curve -> W&B logging
# — not to produce meaningful numbers. Uses GCConceptEmbeddingModel because
# that is the path most likely to break (multi-optimizer + critic).
#
# max_epochs/patience live in the RUN block, not shared_params: run values
# overwrite shared_params, so `-p max_epochs N` on the CLI cannot lower them.
#
# Logs to its own W&B project so it never pollutes real result projects.

results_dir: results/smoke/
trials: 1

shared_params:
  dataset_config:
    dataset: tabulartoy
    batch_size: 64
    num_workers: 8
    root_dir: data/TabularToy/tabulartoy_25_10k/
    considered_concepts: ['0', '1', '2']
    sampling_percent: 1
    test_subsampling: 1

  intervention_config:
    competence_levels: [1]
    intervention_freq: 1
    intervention_batch_size: 1024
    intervention_policies:
      - policy: "random"
        group_level: True
        use_prior: False

  project_name: "smoke_test"
  skip_repr_evaluation: true
  top_k_accuracy: null
  save_model: true
  emb_size: 16
  extra_dims: 0
  weight_decay: 0
  weight_loss: true
  use_task_class_weights: false
  c_extractor_arch: "tabulartoy_extractor"
  bool: false
  momentum: 0.9
  n_hidden: 64
  linear_c2y: true
  check_val_every_n_epoch: 1
  compute_mi_on_gpu: false
  compute_mi_mode: 'cpu'
  accumulate_grad_batches: 1
  c2y_max_epochs: 5
  early_stopping_monitor: 'val_loss'
  early_stopping_mode: min
  early_stopping_delta: 0.0
  gradient_clip_val: 1.0
  eval_from_last: true

runs:
  - architecture: GCConceptEmbeddingModel
    run_name: auto
    sigmoidal_prob: true
    training_intervention_prob: 0
    embedding_activation: leakyrelu
    cbm_optimizer: adam
    adv_optimizer: adam
    cbm_learning_rate: 0.001
    adv_learning_rate: 0.001
    use_adversarial: true
    max_adversarial_lambda: 1
    adversarial_delay: 0
    adversarial_lambda_scheduler_warmup: None
    adversarial_scheduler: none
    adversarial_loss_type: grl
    n_critic_steps: 1
    shared_critic: true
    shared_prob_gen: false
    concept_vector_regularisation: false
    entropy_maximisation: false
    concept_loss_weight: 1
    # Deliberately tiny — smoke test, not a real run.
    max_epochs: 3
    patience: 3
