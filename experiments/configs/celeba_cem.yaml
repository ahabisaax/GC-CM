results_dir: "results/celeba_cem/"
trials: 1

shared_params:
  dataset_config:
    dataset: celeba
    batch_size: 256
    num_workers: 8
    root_dir: data/
    use_binary_vector_class: true
    label_binary_width: 1
    num_concepts: 40
    num_hidden_concepts: 0
    label_dataset_subsample: 12
    image_size: 64

  intervention_config:
    competence_levels: [1]
    intervention_freq: 1
    intervention_batch_size: 256
    intervention_policies:
      - policy: "random"
        group_level: True
        use_prior: False

  skip_repr_evaluation: true
  max_epochs: 300
  top_k_accuracy: null
  save_model: true
  emb_size: 16
  extra_dims: 0
  learning_rate: 0.01
  weight_decay: 4.0e-06
  weight_loss: false
  use_task_class_weights: false
  c_extractor_arch: "resnet18"
  optimizer: sgd
  bool: false
  momentum: 0.9
  sigmoidal_prob: false
  training_intervention_prob: 0
  cbm_optimizer: adam
  n_hidden: 512
  linear_c2y: true
  adv_optimizer: adam
  project_name: "celeba"
  check_val_every_n_epoch: 5
  compute_mi_on_gpu: false
  compute_mi_mode: 'cpu'
  accumulate_grad_batches: 1
  c2y_max_epochs: 150
  early_stopping_monitor: 'val_y_accuracy'
  early_stopping_mode: max
  early_stopping_delta: 0.0
  patience: 400
  gradient_clip_val: 1.0

runs:

  - architecture: "ConceptEmbeddingModel"
    run_name: "auto"
    sigmoidal_prob: true
    training_intervention_prob: 0
    embedding_activation: "leakyrelu"
    cbm_optimizer: adam
    learning_rate: 0.001
    #grid_variables: [concept_loss_weight]
    concept_loss_weight: 0.1

  - architecture: "CriticRegularisedConceptEmbeddingModel"
    run_name: "auto"
    sigmoidal_prob: true
    training_intervention_prob: 0
    embedding_activation: "leakyrelu"
    cbm_optimizer: adam
    cbm_learning_rate: 0.0005
    adv_learning_rate: 0.0001
    use_adversarial: true
    max_adversarial_lambda: 1
    adversarial_delay: 0
    adversarial_lambda_scheduler_warmup: null
    adversarial_scheduler: "none"
    adversarial_loss_type: "grl"
    n_critic_steps: 1
    shared_critic: true
    shared_prob_gen: false
    concept_vector_regularisation: false
    entropy_maximisation: false
    #grid_variables: [concept_loss_weight]
    concept_loss_weight: 0.1
