results_dir: "results/waterbirds/"
trials: 5

shared_params:
  dataset_config:
    dataset: waterbirds
    num_workers: 4
    batch_size: 64
    root_dir: data/
    train_augment: true
    weight_loss: false

  intervention_config:
    competence_levels: [1]
    intervention_freq: 1
    intervention_batch_size: 64
    intervention_policies:
      - policy: "random"
        group_level: True
        use_prior: False

  skip_repr_evaluation: true
  max_epochs: 100
  top_k_accuracy: null
  save_model: true
  emb_size: 16
  extra_dims: 0
  weight_decay: 1.0e-04
  weight_loss: false
  use_task_class_weights: false
  c_extractor_arch: "resnet50"
  optimizer: adam
  cbm_optimizer: adam
  bool: false
  sigmoidal_prob: true
  training_intervention_prob: 0
  n_hidden: 512
  linear_c2y: true
  adv_optimizer: adam
  project_name: "waterbirds"
  check_val_every_n_epoch: 5
  compute_mi_on_gpu: false
  compute_mi_mode: cpu
  accumulate_grad_batches: 1
  c2y_max_epochs: 100
  early_stopping_monitor: val_y_accuracy
  early_stopping_mode: max
  early_stopping_delta: 0.0
  patience: 20
  gradient_clip_val: 1.0

runs:

  # ── CEM (vanilla) ──────────────────────────────────────────────────────────
  - architecture: "ConceptEmbeddingModel"
    run_name: "auto"
    embedding_activation: "leakyrelu"
    learning_rate: 1.0e-04
    concept_loss_weight: 0.1

  - architecture: "ConceptEmbeddingModel"
    run_name: "auto"
    embedding_activation: "leakyrelu"
    learning_rate: 1.0e-04
    concept_loss_weight: 0.5

  - architecture: "ConceptEmbeddingModel"
    run_name: "auto"
    embedding_activation: "leakyrelu"
    learning_rate: 1.0e-04
    concept_loss_weight: 1.0

  # ── GC-CEM (shared critic, GRL) ───────────────────────────────────────────
  - architecture: "CriticRegularisedConceptEmbeddingModel"
    run_name: "auto"
    embedding_activation: "leakyrelu"
    cbm_learning_rate: 1.0e-04
    adv_learning_rate: 1.0e-04
    use_adversarial: true
    max_adversarial_lambda: 1
    adversarial_delay: 0
    adversarial_lambda_scheduler_warmup: null
    adversarial_scheduler: "none"
    adversarial_loss_type: "grl"
    n_critic_steps: 1
    shared_critic: true
    shared_prob_gen: false
    concept_vector_regularisation: false
    entropy_maximisation: false
    concept_loss_weight: 0.1

  - architecture: "CriticRegularisedConceptEmbeddingModel"
    run_name: "auto"
    embedding_activation: "leakyrelu"
    cbm_learning_rate: 1.0e-04
    adv_learning_rate: 1.0e-04
    use_adversarial: true
    max_adversarial_lambda: 1
    adversarial_delay: 0
    adversarial_lambda_scheduler_warmup: null
    adversarial_scheduler: "none"
    adversarial_loss_type: "grl"
    n_critic_steps: 1
    shared_critic: true
    shared_prob_gen: false
    concept_vector_regularisation: false
    entropy_maximisation: false
    concept_loss_weight: 0.5

  - architecture: "CriticRegularisedConceptEmbeddingModel"
    run_name: "auto"
    embedding_activation: "leakyrelu"
    cbm_learning_rate: 1.0e-04
    adv_learning_rate: 1.0e-04
    use_adversarial: true
    max_adversarial_lambda: 1
    adversarial_delay: 0
    adversarial_lambda_scheduler_warmup: null
    adversarial_scheduler: "none"
    adversarial_loss_type: "grl"
    n_critic_steps: 1
    shared_critic: true
    shared_prob_gen: false
    concept_vector_regularisation: false
    entropy_maximisation: false
    concept_loss_weight: 1.0
