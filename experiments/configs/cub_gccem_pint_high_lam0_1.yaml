# CUB GC-CEM at high p_int, lambda_c = 0.1: p_int in {0.75, 0.85, 0.9}, one fold,
# 100 epochs -> 3 runs. Same settings as the GC-CEM runs in
# cub_pint_sweep_lam0_1.yaml (where p_int = 0.75 failed); only p_int differs.
# Separate results_dir so nothing from the failed run is reused.
#
#   python experiments/run_experiments.py -c experiments/configs/cub_gccem_pint_high_lam0_1.yaml
results_dir: results/cub_gccem_pint_high_lam0_1/
trials: 1
shared_params:
  dataset_config:
    dataset: cub
    num_workers: 8
    batch_size: 256
    root_dir: data/CUB200/
    sampling_percent: 1
    sampling_groups: true
    test_subsampling: 1
    weight_loss: true
  intervention_config:
    competence_levels: [1]
    intervention_freq: 1
    intervention_batch_size: 64
    intervention_policies:
      - policy: random
        group_level: true
        use_prior: false
  skip_repr_evaluation: true
  max_epochs: 100
  c2y_max_epochs: 150
  patience: 400
  top_k_accuracy: null
  save_model: true
  emb_size: 32
  extra_dims: 0
  weight_decay: 4.0e-06
  weight_loss: true
  use_task_class_weights: true
  c_extractor_arch: resnet18
  bool: false
  sigmoidal_prob: true
  momentum: 0.9
  n_hidden: 512
  linear_c2y: true
  check_val_every_n_epoch: 5
  early_stopping_monitor: val_y_accuracy
  early_stopping_mode: max
  early_stopping_delta: 0.0
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  compute_mi_on_gpu: false
  compute_mi_mode: cpu
  compute_rtl_rcl: true
  cbm_optimizer: adam
  adv_optimizer: adam
  embedding_activation: leakyrelu
  concept_loss_weight: 0.1
  project_name: cub pint sweep

runs:
  - architecture: GCConceptEmbeddingModel
    run_name: GCCEM_pint{training_intervention_prob}_lam_c0.1_100ep
    grid_variables: [training_intervention_prob]
    training_intervention_prob: [0.75, 0.85, 0.9]
    learning_rate: 0.01
    cbm_learning_rate: 0.0005
    adv_learning_rate: 0.0001
    use_adversarial: true
    max_adversarial_lambda: 1
    adversarial_delay: 0
    adversarial_lambda_scheduler_warmup: null
    adversarial_scheduler: none
    adversarial_loss_type: grl
    n_critic_steps: 1
    shared_critic: true
    shared_prob_gen: false
    concept_vector_regularisation: false
    entropy_maximisation: false
