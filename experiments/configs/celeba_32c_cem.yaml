# Concept-count ablation: CelebA with N concepts, single fold.
# Generated from celeba_cem.yaml (top-N balanced attributes, 1000-class task).
# eval_from_last mirrors the celeba_redone protocol.
results_dir: results/celeba_32c/
trials: 1
shared_params:
  dataset_config:
    dataset: celeba
    split_seed: 42          # deterministic train/val/test split
    batch_size: 512
    num_workers: 8
    root_dir: data/
    num_classes: 1000
    use_binary_vector_class: true
    use_imbalance: true
    label_binary_width: 1
    num_concepts: 32
    num_hidden_concepts: 2
    label_dataset_subsample: 12
    image_size: 64
  intervention_config:
    competence_levels:
    - 1
    intervention_freq: 1
    intervention_batch_size: 256
    intervention_policies:
    - policy: random
      group_level: true
      use_prior: false
  skip_repr_evaluation: true
  max_epochs: 150
  top_k_accuracy: null
  save_model: true
  emb_size: 32
  extra_dims: 0
  learning_rate: 0.005
  weight_decay: 4.0e-06
  weight_loss: false
  use_task_class_weights: false
  c_extractor_arch: resnet34
  optimizer: sgd
  cbm_optimizer: sgd
  bool: false
  momentum: 0.9
  sigmoidal_prob: false
  training_intervention_prob: 0
  n_hidden: 512
  linear_c2y: true
  adv_optimizer: adam
  project_name: CelebA_concept_ablation
  check_val_every_n_epoch: 5
  compute_mi_on_gpu: false
  compute_mi_mode: cpu
  accumulate_grad_batches: 1
  c2y_max_epochs: 150
  early_stopping_monitor: val_loss
  early_stopping_mode: min
  early_stopping_delta: 0.0
  patience: 30
  gradient_clip_val: 1.0
  eval_from_last: true
runs:
- architecture: ConceptEmbeddingModel
  run_name: auto
  sigmoidal_prob: true
  training_intervention_prob: 0
  embedding_activation: leakyrelu
  cbm_optimizer: adam
  learning_rate: 0.001
  concept_loss_weight: 0.1
