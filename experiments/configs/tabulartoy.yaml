trials: 5
results_dir: results/tabulartoy_25_10k_models_600epochs/

shared_params:
  # Dataset Configuration
  dataset_config:
    dataset: tabulartoy
    batch_size: 64
    num_workers: 4
    root_dir: data/TabularToy/tabulartoy_25_10k/ #for tabulartoy, this is where you find the pre-sampled dataset
    considered_concepts: ['0', '1', '2']
    sampling_percent: 1
    test_subsampling: 1


  # Intervention evaluation
  intervention_config:
    competence_levels: [1] #[1, 0]
    intervention_freq: 1
    intervention_batch_size: 1024
    intervention_policies:
      - policy: "random"
        group_level: True
        use_prior: False


  skip_repr_evaluation: True #Set to False to compute OIS, NIS and CAS
  learning_rate: 0.05
  bool: False
  sigmoidal_prob: False
  hidden_size: 64
  dropout_prob: 0.2
  all_dropout: False

  learning_rate_c2y: 0.05
  optimizer_c2y: adam
  c2y_max_epochs: 100
  linear_c2y: True

  n_hidden: 64
  emb_size: 16

  weight_loss: True
  top_k_accuracy: null
  save_model: True
  extra_dims: 0
  scheduler_step: 20
  weight_decay: 0
  c_extractor_arch: tabulartoy_extractor
  cbm_learning_rate: 0.05
#  adv_learning_rate: 0.05


  momentum: 0.9
  project_name: "Tabulartoy ts"
  max_epochs: 250
  check_val_every_n_epoch: 5

runs:
# HARD:
