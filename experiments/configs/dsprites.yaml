trials: 5
results_dir: results/dsprites_ACBM_shared_critic

shared_params:
  # Dataset Configuration
  dataset_config:
    dataset: dsprites
    batch_size: 64
    num_workers: 8
    root_dir: data/dsprites/dsprites_dep_0.npz # this is where you find the pre-sampled dataset
    sampling_percent: 1
    test_subsampling: 1


  # Intervention evaluation
  intervention_config:
    competence_levels: [1] #[1, 0]
    intervention_freq: 1
    intervention_batch_size: 64
    intervention_policies:
      - policy: "random"
        group_level: True
        use_prior: False


  skip_repr_evaluation: True #Set to False to compute OIS, NIS and CAS
  #concept_loss_weight: 1
  learning_rate: 0.0001
  bool: False
  sigmoidal_prob: False
  dropout_prob: 0.2
  all_dropout: False

  learning_rate_c2y: 0.0001
  optimizer_c2y: adam
  c2y_max_epochs: 100
  c2y_layers: [128, 64]
  linear_c2y: False

  n_hidden: 512
  emb_size: 16

  weight_loss: False #False weighting of the concepts in loss
  use_task_class_weights: True #False weighting of the task in loss
  top_k_accuracy: null
  save_model: True
  #patience: 200
  extra_dims: 0
  scheduler_step: 20
  weight_decay: 0
  c_extractor_arch: dsprites_extractor
  cbm_optimizer: adam
  cbm_learning_rate: 0.0005
  #adv_learning_rate: 0.0001
  adv_optimizer: adam
  early_stopping_delta: 0.0
  check_val_every_n_epoch: 5
  momentum: 0.9
  compute_mi_on_gpu: False
  compute_mi_mode: 'cpu'
  project_name: "Dsprites CEM"



