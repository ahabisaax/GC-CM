# AwA2 CEM, lam_c 0.5, 5 folds, FULL eval.
# Baseline counterpart to awa2_gccem_5fold.yaml: every shared_param is
# identical so the two are directly comparable. Only the run block differs.
# lr 1e-3 is the canonical CEM setting (GC-CEM uses 5e-4), matching the
# CEM/GC-CEM pairing used on CUB and CelebA.
# Interventions: random policy over 17 verified semantic concept groups
# (18-point curve), matching CUB's group-level procedure (28 groups).
# RTL/RCL enabled: K=85 -> 7,225 MLP fits at the 2000-sample cap.
results_dir: results/awa2_5fold/
trials: 5
shared_params:
  dataset_config:
    dataset: awa2
    batch_size: 512
    num_workers: 8
    root_dir: data/
    image_size: 128
    train_augment: true
    weight_loss: false
    sampling_percent: 1
    test_subsampling: 1
    semantic_concept_groups: true
  intervention_config:
    competence_levels:
    - 1
    intervention_freq: 1
    intervention_batch_size: 512
    intervention_policies:
    - policy: random
      group_level: true
      use_prior: false
  skip_repr_evaluation: true
  max_epochs: 90
  top_k_accuracy: null
  save_model: true
  emb_size: 16
  extra_dims: 0
  weight_decay: 4.0e-06
  weight_loss: false
  use_task_class_weights: false
  c_extractor_arch: resnet34
  bool: false
  momentum: 0.9
  sigmoidal_prob: false
  training_intervention_prob: 0
  n_hidden: 512
  linear_c2y: true
  check_val_every_n_epoch: 5
  compute_mi_on_gpu: false
  project_name: AwA2
  compute_mi_mode: cpu
  accumulate_grad_batches: 1
  c2y_max_epochs: 90
  early_stopping_monitor: val_y_accuracy
  early_stopping_mode: max
  early_stopping_delta: 0.0
  patience: 200
  gradient_clip_val: 1.0
  eval_from_last: true
  compute_rtl_rcl: true
runs:
- architecture: ConceptEmbeddingModel
  run_name: auto
  sigmoidal_prob: true
  training_intervention_prob: 0
  embedding_activation: leakyrelu
  cbm_optimizer: adam
  learning_rate: 0.001
  concept_loss_weight: 0.5
