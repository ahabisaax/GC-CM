# Diagnostic probe: Joint CBM lam_c 0.1, lr 1e-3, 150 epochs, 1 fold.
# Tests whether the 74% task accuracy of the 5e-3 / 90-epoch runs is caused
# by the learning rate rather than by the architecture. Everything else is
# identical to awa2_cbm_5fold_lam0_1.yaml so the comparison is clean.
# Reference points at 90 epochs: joint CBM lr5e-3 = 74.05% task / 90.58%
# concept; GC-CBM lr5e-4 = 84.15% / 96.27%; CEM lr1e-3 = 82.77% / 95.80%.
results_dir: results/awa2_probe/
trials: 1
shared_params:
  dataset_config:
    dataset: awa2
    batch_size: 512
    num_workers: 8
    root_dir: data/
    image_size: 128
    train_augment: true
    weight_loss: false
    sampling_percent: 1
    test_subsampling: 1
    semantic_concept_groups: true
  intervention_config:
    competence_levels:
    - 1
    intervention_freq: 1
    intervention_batch_size: 512
    intervention_policies:
    - policy: random
      group_level: true
      use_prior: false
  skip_repr_evaluation: true
  max_epochs: 150
  top_k_accuracy: null
  save_model: true
  emb_size: 16
  extra_dims: 0
  weight_decay: 4.0e-06
  weight_loss: false
  use_task_class_weights: false
  c_extractor_arch: resnet34
  bool: false
  momentum: 0.9
  sigmoidal_prob: false
  training_intervention_prob: 0
  n_hidden: 512
  linear_c2y: true
  check_val_every_n_epoch: 5
  compute_mi_on_gpu: false
  project_name: AwA2
  compute_mi_mode: cpu
  accumulate_grad_batches: 1
  c2y_max_epochs: 150
  early_stopping_monitor: val_y_accuracy
  early_stopping_mode: max
  early_stopping_delta: 0.0
  patience: 200
  gradient_clip_val: 1.0
  eval_from_last: true
  compute_rtl_rcl: true
runs:
- architecture: ConceptBottleneckModel
  run_name: auto
  sigmoidal_prob: true
  bool: false
  cbm_optimizer: adam
  learning_rate: 0.001
  concept_loss_weight: 0.1
