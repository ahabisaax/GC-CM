# AwA2 Sequential CBM, lam_c 1, 5 folds, FULL eval.
# CBM arm of the AwA2 suite. shared_params are identical to the CEM/GC-CEM
# configs (90 epochs, batch 512, 17 semantic groups, intervention_freq 1,
# eval_from_last, val_y_accuracy checkpointing) so every AwA2 model is
# directly comparable.
# lr follows the CelebA CBM convention (joint/hard/seq 5e-3, GC-CBM 5e-4):
# AwA2 has no CBM precedent, and CelebA is the closest match (resnet34,
# batch 512, same eval pipeline).
# RTL/RCL does not apply: _add_rtl_rcl returns early for non-CEM
# architectures because CBMs have no embedding space. Leakage for this arm
# is CTL/ICL at the concept-probability level.
results_dir: results/awa2_5fold_cbm/
trials: 5
shared_params:
  dataset_config:
    dataset: awa2
    batch_size: 512
    num_workers: 8
    root_dir: data/
    image_size: 128
    train_augment: true
    weight_loss: false
    sampling_percent: 1
    test_subsampling: 1
    semantic_concept_groups: true
  intervention_config:
    competence_levels:
    - 1
    intervention_freq: 1
    intervention_batch_size: 512
    intervention_policies:
    - policy: random
      group_level: true
      use_prior: false
  skip_repr_evaluation: true
  max_epochs: 90
  top_k_accuracy: null
  save_model: true
  emb_size: 16
  extra_dims: 0
  weight_decay: 4.0e-06
  weight_loss: false
  use_task_class_weights: false
  c_extractor_arch: resnet34
  bool: false
  momentum: 0.9
  sigmoidal_prob: false
  training_intervention_prob: 0
  n_hidden: 512
  linear_c2y: true
  check_val_every_n_epoch: 5
  compute_mi_on_gpu: false
  project_name: AwA2
  compute_mi_mode: cpu
  accumulate_grad_batches: 1
  c2y_max_epochs: 90
  early_stopping_monitor: val_y_accuracy
  early_stopping_mode: max
  early_stopping_delta: 0.0
  patience: 200
  gradient_clip_val: 1.0
  eval_from_last: true
  compute_rtl_rcl: true
runs:
- architecture: SequentialConceptBottleneckModel
  run_name: auto
  sigmoidal_prob: true
  bool: false
  cbm_optimizer: adam
  learning_rate: 0.005
  concept_loss_weight: 1
